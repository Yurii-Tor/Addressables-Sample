name: Tests

# Runs the full EditMode and PlayMode suites on every push and pull request.
# PlayMode runs against the Addressables "Use Asset Database" workflow, which is the
# project default and needs no content build or server.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE   contents of your Unity_lic.ulf personal licence file
#   UNITY_EMAIL     Unity account e-mail
#   UNITY_PASSWORD  Unity account password

on:
  push:
    branches: [main, develop]
    # Showcase-only changes do not need Unity validation.
    paths-ignore:
      - '**/*.md'
      - 'Docs/**'
      - 'LICENSE'
      - '.github/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: EditMode + PlayMode
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.21f1
          testMode: all
          artifactsPath: TestResults
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test results

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}

  validate:
    name: Generated-project validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # Runs setup twice to prove idempotency, then asserts the structural validator.
      - name: Setup twice, then validate
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.21f1
          targetPlatform: StandaloneLinux64
          buildMethod: AddressablesSample.Game.Editor.ContinuousIntegration.VerifyGeneratedProject
          allowDirtyBuild: true
