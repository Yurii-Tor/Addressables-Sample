name: WebGL demo

# Builds the playable WebGL demo and publishes it to GitHub Pages.
# Enable Pages first: Settings > Pages > Source: GitHub Actions.
# Uses the same Unity secrets as tests.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: webgl-demo
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build WebGL player
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      # The project deliberately does not build Addressables during a player build, so the
      # custom build method builds the content explicitly before producing the player.
      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.21f1
          targetPlatform: WebGL
          buildMethod: AddressablesSample.Game.Editor.ContinuousIntegration.BuildWebGl
          buildsPath: Builds
          allowDirtyBuild: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Builds/WebGL

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
